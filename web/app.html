<title>Adulted</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112,700;112,800;112,900&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Adulted: an appliance manual you actually want to read. Cool paper, ink line drawings,
   one amber highlight that always means "look here". Green, amber and red only ever mean status. */
:root{
  --paper:#F1F4F7; --card:#FFFFFF; --ink:#16212E; --muted:#56657A; --line:#CBD5E0; --line2:#AEBBCA;
  --blue:#1F4FD8; --blue-ink:#FFFFFF; --blue-soft:#E3EAFB;
  --amber:#FFB81C; --amber-soft:#FFF3D1; --amber-ink:#5C3D00;
  --green:#18864B; --green-soft:#E1F3E8; --red:#C8102E; --red-soft:#FDE8EB;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif; --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--paper);-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;margin:0}
a{color:var(--blue)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
.wrap{max-width:640px;margin:0 auto;padding:6px 16px 112px}
h1,h2,h3{font-family:var(--display);font-stretch:112%;margin:0;line-height:1.08;text-wrap:balance}
h1{font-weight:900;font-size:clamp(32px,8.4vw,44px);letter-spacing:-.01em}
h2{font-weight:800;font-size:22px}
h3{font-weight:800;font-size:18px;line-height:1.2}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:15px}
.stack{display:flex;flex-direction:column;gap:10px}
.sec{margin-top:28px;display:flex;flex-direction:column;gap:12px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sec-head a{font-size:15px;font-weight:700;text-decoration:none}

/* top bar and tabs */
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 0 4px}
.mark{font-family:var(--display);font-stretch:125%;font-weight:900;font-size:22px;color:var(--ink);text-decoration:none;display:flex;align-items:center;gap:8px;letter-spacing:-.01em}
.mark i{display:inline-block;width:14px;height:14px;background:var(--amber);border:2.5px solid var(--ink);border-radius:3px;transform:rotate(45deg)}
.plan-chip{font-size:14px;font-weight:700;text-decoration:none;color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:3px 12px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--card);border-top:1.5px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12.5px;font-weight:700;color:var(--muted);text-decoration:none;padding:5px 0;border-radius:10px}
.tabs a[aria-current="page"]{color:var(--ink);background:var(--amber-soft)}
.tabs a.sos{color:var(--red)}
.tabs a.sos[aria-current="page"]{background:var(--red-soft)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:10px;border:2px solid var(--ink);background:var(--ink);color:#fff;font-weight:700;font-size:17px;text-decoration:none;cursor:pointer}
.btn.blue{background:var(--blue);border-color:var(--blue)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.full{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.linkbtn{background:none;border:0;padding:0;color:var(--blue);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* home */
.hello{margin-top:14px;display:flex;flex-direction:column;gap:14px}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border:2.5px solid var(--ink);border-radius:14px;padding:0 14px;min-height:58px}
.search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:18px;color:var(--ink);padding:14px 0}
.search input:focus{outline:none}
.search:focus-within{box-shadow:0 0 0 4px var(--amber)}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.quick a{font-size:15px;font-weight:700;color:var(--ink);text-decoration:none;background:var(--card);border:1.5px solid var(--line2);border-radius:999px;padding:6px 13px}
.sos-band{background:var(--red);color:#fff;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.sos-band h2{color:#fff;font-size:20px}
.sos-band .row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sos-band .row3 a{background:#fff;color:var(--ink);text-decoration:none;font-weight:700;font-size:15px;border-radius:10px;padding:10px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;line-height:1.2}
.sos-band .more{color:#fff;font-weight:700;font-size:15px}
.murphy{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;background:var(--ink);color:#fff;border-radius:16px;padding:16px;text-decoration:none}
.murphy h3{color:#fff;font-size:20px}
.murphy .score{font-family:var(--display);font-stretch:125%;font-weight:900;font-size:34px;line-height:1;background:var(--amber);color:var(--ink);border-radius:12px;padding:12px 10px;text-align:center;min-width:84px}
.murphy .score small{font-size:13px;font-weight:700;display:block;margin-top:2px}
.murphy-head p{font-size:18px}
.sos-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.sos-grid a{display:flex;gap:10px;align-items:center;background:var(--card);border:2px solid var(--red);border-radius:12px;padding:10px;text-decoration:none;color:var(--ink);font-weight:700;font-size:15.5px;line-height:1.2}
.sos-grid .ic{flex:none;width:34px;height:34px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center}
.stand .bar{position:relative;height:30px;background:var(--paper);border:1.5px solid var(--line);border-radius:8px;overflow:hidden}
.stand .bar span{display:block;height:100%;background:var(--amber)}
.stand .bar b{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:15px}
.stand .src{font-size:12.5px;color:var(--muted)}
.snap-promo{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;background:var(--blue-soft);border:2px solid var(--blue);border-radius:14px;padding:12px 14px;text-decoration:none;color:var(--ink)}
.snap-promo .ic{width:46px;height:46px;border-radius:12px;background:var(--blue);color:#fff;display:grid;place-items:center}
.snap-promo b{display:block}
.snap-pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.snap-img{display:block;width:100%;border-radius:12px;border:2px solid var(--ink)}
.snap-marked{position:relative;border-radius:12px;overflow:hidden;border:2.5px solid var(--ink)}
.snap-marked img{display:block;width:100%}
.snap-marked .mark{position:absolute;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;background:var(--amber);border:3px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:16px;box-shadow:0 0 0 3px #fff}
.tool{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:12px 14px;text-decoration:none;color:var(--ink)}
.tool .ic{width:46px;height:46px;border-radius:12px;background:var(--amber);border:2px solid var(--ink);display:grid;place-items:center}
.tool b{display:block}
.ingr{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ingr li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1.5px solid var(--line)}
.ingr li:first-child{border-top:0}
.addrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.split{display:flex;height:22px;border:2px solid var(--ink);border-radius:8px;overflow:hidden}
.split span+span{border-left:2px solid var(--ink)}
.big-num{font-family:var(--display);font-stretch:112%;font-weight:900;font-size:26px}
.tip{background:var(--amber-soft);border-left:6px solid var(--amber);border-radius:4px 12px 12px 4px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.tip b{display:block;font-size:14px;color:var(--amber-ink)}

/* rows: guides, modules */
.list{background:var(--card);border:1.5px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;text-decoration:none;color:inherit;border-top:1.5px solid var(--line)}
.row:first-child{border-top:0}
.row .thumb{width:52px;height:52px;border-radius:10px;background:var(--paper);border:1.5px solid var(--line);display:grid;place-items:center;overflow:hidden}
.row .thumb svg{width:64px;height:40px}
.row .nm{font-weight:700;line-height:1.25}
.row .sub{font-size:14.5px;color:var(--muted)}
.row .go{font-size:14px;font-weight:700;color:var(--blue);white-space:nowrap}
.row.done .nm::after{content:"Done";margin-left:8px;font-size:12.5px;font-weight:700;color:var(--green);background:var(--green-soft);padding:2px 8px;border-radius:999px;vertical-align:2px}
.mods{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mod{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:6px;min-height:132px}
.mod .ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--paper);border:1.5px solid var(--line)}
.mod.live .ic{background:var(--amber);border-color:var(--ink)}
.mod .st{font-size:13.5px;font-weight:700;color:var(--muted)}
.mod.live .st{color:var(--green)}
.progress{height:10px;background:var(--paper);border:1.5px solid var(--line);border-radius:999px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--green)}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:16px}

/* status chips */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{white-space:nowrap;font-size:14px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--card);border:1.5px solid var(--line);display:inline-flex;align-items:center;gap:6px}
.chip.l1{background:var(--green-soft);border-color:transparent;color:var(--green)}
.chip.l2{background:var(--amber-soft);border-color:transparent;color:var(--amber-ink)}
.chip.l3{background:var(--red-soft);border-color:transparent;color:var(--red)}
.warn{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:12px 14px;font-size:16px;background:var(--amber-soft);color:var(--amber-ink)}
.warn.red{background:var(--red-soft);color:#7A0A1C}
.warn svg{flex:none;margin-top:2px}

/* guide: the step deck */
.back{display:inline-flex;align-items:center;gap:4px;font-weight:700;text-decoration:none;font-size:15px;margin-top:8px}
.ghead{margin-top:10px;display:flex;flex-direction:column;gap:10px}
.tools{font-size:15.5px;color:var(--muted)}
.deck{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;margin:6px -16px 0;padding:4px 16px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.deck::-webkit-scrollbar{display:none}
.step{flex:0 0 100%;scroll-snap-align:center;background:var(--card);border:2.5px solid var(--ink);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.step .pic{background:var(--paper);border-bottom:2.5px solid var(--ink);position:relative;aspect-ratio:16/9}
.step .pic svg,.step .pic img,.step .pic video{display:block;width:100%;height:100%;object-fit:cover}
.step .tag{position:absolute;right:10px;bottom:8px;font-size:12px;color:var(--muted);background:rgba(255,255,255,.85);padding:1px 8px;border-radius:999px}
.step .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px}
.step .n{font-size:14px;font-weight:700;color:var(--muted)}
.step h2{font-size:24px}
.step .d{font-size:19px;line-height:1.4}
.step details{margin-top:4px;font-size:16px;color:var(--muted)}
.step summary{cursor:pointer;font-weight:700;color:var(--blue);list-style:none}
.step summary::-webkit-details-marker{display:none}
.step details p{margin-top:6px}
.decknav{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;margin-top:10px}
.dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line2)}
.dots i.on{background:var(--ink);width:22px;border-radius:999px}
.navbtn{width:52px;height:52px;border-radius:50%;border:2.5px solid var(--ink);background:var(--card);display:grid;place-items:center;cursor:pointer}
.navbtn.next{background:var(--amber)}
.navbtn:disabled{opacity:.3;cursor:default}
.finish{display:flex;flex-direction:column;gap:10px}
.done-msg{background:var(--green-soft);color:var(--green);font-weight:700;border-radius:12px;padding:12px 14px;display:flex;gap:8px;align-items:center}

/* ask */
textarea,input[type=text],select{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line2);border-radius:10px;padding:12px 14px;width:100%}
textarea{min-height:110px;resize:vertical;font-size:18px}
textarea:focus,input[type=text]:focus,select:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px var(--amber)}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:15.5px}
.answer{background:var(--card);border:2.5px solid var(--ink);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.answer ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:a}
.answer ol>li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;counter-increment:a}
.answer ol>li::before{content:counter(a);width:34px;height:34px;border-radius:50%;background:var(--amber);border:2px solid var(--ink);display:grid;place-items:center;font-weight:700;font-family:var(--display)}
.answer ol>li b{display:block}
.answer .foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14.5px;color:var(--muted);border-top:1.5px solid var(--line);padding-top:10px}
.meter{font-size:15px;color:var(--muted)}
.err{color:var(--red);font-weight:700}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line2);border-top-color:var(--ink);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* help */
.panic{display:flex;flex-direction:column;gap:8px}
.panic a{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--card);border:2px solid var(--red);border-radius:14px;padding:14px;text-decoration:none;color:var(--ink);font-weight:700;font-size:18px}
.panic a .ic{width:40px;height:40px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center}
.call{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-top:1.5px solid var(--line)}
.call:first-child{border-top:0}
.call a.num{background:var(--ink);color:#fff;text-decoration:none;font-weight:700;border-radius:10px;padding:10px 14px;white-space:nowrap;font-size:16px}

/* checklist */
.check{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;align-items:start;padding:12px 14px;border-top:1.5px solid var(--line);cursor:pointer}
.check:first-child{border-top:0}
.check input{appearance:none;-webkit-appearance:none;width:28px;height:28px;border:2.5px solid var(--ink);border-radius:8px;margin:0;background:var(--card);display:grid;place-items:center;cursor:pointer}
.check input:checked{background:var(--green);border-color:var(--green)}
.check input:checked::after{content:"";width:12px;height:7px;border:3px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-2px)}
.check input:checked + span{color:var(--muted);text-decoration:line-through}

/* plans */
.tiers{display:flex;flex-direction:column;gap:12px}
.tier{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px}
.tier.gold{border-color:var(--ink);box-shadow:6px 6px 0 var(--amber)}
.tier .price{font-family:var(--display);font-stretch:112%;font-weight:900;font-size:30px}
.tier ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.tier li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;font-size:16px}
.tier li.soon{color:var(--muted)}
.tier li.soon em{font-style:normal;font-size:13px;font-weight:700;background:var(--paper);border-radius:999px;padding:1px 7px;margin-left:4px}
.pricelist{display:flex;flex-direction:column}
.pricelist div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1.5px solid var(--line);font-size:16px}
.pricelist div:first-child{border-top:0}
.pricelist b{white-space:nowrap}

.lvl{display:flex;gap:14px;align-items:center}
.lvl .big{font-family:var(--display);font-stretch:125%;font-weight:900;font-size:44px;line-height:1;background:var(--amber);border:2.5px solid var(--ink);border-radius:14px;min-width:72px;height:72px;display:grid;place-items:center}
.form{display:flex;flex-direction:column;gap:14px}
.two{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:700;border-radius:999px;padding:10px 18px;z-index:40;font-size:15px}
@media (prefers-reduced-motion:reduce){.spin{animation:none}.deck{scroll-behavior:auto}}
@media (min-width:700px){.step .d{font-size:20px}}
</style>

<div class="wrap">
  <header class="top"><a class="mark" href="#"><i></i>Adulted</a><a class="plan-chip" id="planChip" href="#plans">Free</a></header>
  <main id="app"></main>
</div>
<nav class="tabs" id="tabs" aria-label="Main"></nav>
<div class="toast" id="toast" role="status" hidden></div>

<script>
/* ---------- basics ---------- */
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = (sel) => document.querySelector(sel);
const app = document.getElementById("app");
const pad = (n) => String(n).padStart(2, "0");
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const money = (n) => "$" + n.toFixed(2);
const art = (k) => ADULTED_ART.illustration(k);
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 2200); }

const ICONS = {
  home:'<path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>',
  book:'<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/><path d="M9 7h6"/>',
  chat:'<path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/>',
  sos:'<path d="M12 3 2 20h20z"/><path d="M12 10v4"/><circle cx="12" cy="17" r=".6" fill="currentColor"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',
  back:'<path d="M15 5l-7 7 7 7"/>', next:'<path d="M9 5l7 7-7 7"/>',
  check:'<path d="M5 12l5 5 9-10"/>', x:'<path d="M6 6l12 12M18 6 6 18"/>',
  phone:'<path d="M5 4h4l2 5-3 2a11 11 0 0 0 5 5l2-3 5 2v4a2 2 0 0 1-2 2A17 17 0 0 1 3 6a2 2 0 0 1 2-2"/>',
  flame:'<path d="M12 3c1 4 6 6 6 11a6 6 0 0 1-12 0c0-3 2-4 2-7 2 1 3 2 4 4 0-3-1-5 0-8"/>',
  drop:'<path d="M12 3s7 7 7 12a7 7 0 0 1-14 0c0-5 7-12 7-12"/>',
  key:'<circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M17 6l3 3"/>',
  bolt:'<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>', bell:'<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/>',
  toilet:'<path d="M7 3h10v7H7z"/><path d="M4 11h16a8 8 0 0 1-8 7v3H9v-3"/>',
  wallet:'<path d="M3 7h18v13H3z"/><path d="M3 7l12-4v4"/><circle cx="16" cy="13.5" r="1.2"/>',

function searchGuides(q){

function readyScore(){

// Shrink a photo to at most 1280px on the long side so it uploads fast on a phone connection.
function shrinkPhoto(file){
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const scale = Math.min(1, 1280 / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg", 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("bad_image")); };
    img.src = url;
  });
}

/* ---------- Ask Anything ---------- */
const API = typeof window.ADULTED_API === "string" ? window.ADULTED_API.replace(/\/$/, "") : null;
async function aiCall(kind, payload){
  if (API === null) throw { code: "no_api" };
  TASKS[kind].input(payload); // check it here first; the server checks it again
  let res, body = {};
  try { res = await fetch(`${API}/ai/${kind}`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(payload) }); }
  catch (e) { throw { code: "offline" }; }
  try { body = await res.json(); } catch (e) {}
  if (!res.ok) throw { code: body.error === "daily_limit" ? "busy" : res.status === 429 ? "rate_limited" : "upstream" };
  return body.result;
}
const ERRS = {
  no_api: "Ask Anything isn't connected in this preview. It works in the app and on the website.",
  offline: "You look offline. Check your connection and try again.",
  rate_limited: "That's a lot of questions in a few minutes. Wait a bit and try again.",

  let i = -1;
  const [d, t] = checklistPct(id);
  app.innerHTML = `<a class="back" href="${c.kit ? "#help" : "#learn"}">${ico("back", 18)} ${c.kit ? "Ready" : "Learn"}</a>
  <section class="hello"><h1>${esc(c.n)}${c.kit ? "" : " checklist"}</h1>${c.blurb ? `<p>${esc(c.blurb)}.</p>` : ""}<p class="muted" id="cnt">${d} of ${t} done</p><div class="progress"><span id="bar" style="width:${Math.round(d / t * 100)}%"></span></div></section>
  ${c.groups.map(([g, items]) => `<section class="sec"><h2>${esc(g)}</h2><div class="list">${items.map((it) => { i++; return `<label class="check"><input type="checkbox" data-i="${i}"${saved[i] ? " checked" : ""}><span>${esc(it)}</span></label>`; }).join("")}</div></section>`).join("")}`;
  document.querySelectorAll(".check input").forEach((box) => box.addEventListener("change", () => {
    CHECKS[id] = Object.assign({}, CHECKS[id], { [box.dataset.i]: box.checked });
    store.set("checks", CHECKS);
    const [d2, t2] = checklistPct(id);
    $("#cnt").textContent = `${d2} of ${t2} done`; $("#bar").style.width = Math.round(d2 / t2 * 100) + "%";
    if (d2 === t2) toast(c.kit ? `${c.n} complete. You're ready.` : "Checklist complete. You're officially moved in.");
  }));
}

/* ---------- Where you stand: you compared with people your age ---------- */
function standItems(){
  const age = +PROFILE.age, out = [];
  if (!age) return out;
  const home = benchmark("home", age);
  if (home && PROFILE.living) {
    const atHome = PROFILE.living === "With family";
    out.push({ key: "home", b: home, you: atHome, label: "Live with their parents", youTxt: atHome ? "You live at home" : "You have your own place",
      msg: atHome
        ? (home.pct >= 40
          ? `You're in good company: ${Math.round(home.pct)}% of people ${home.range} live with their parents. Living at home can be a smart way to save. When you're ready, start planning your move.`
          : `Most people ${home.range} have their own place. Only ${Math.round(home.pct)}% still live with their parents. Saving up at home is smart, and when you're ready to make the jump, here's where to start.`)
        : `You did it. You're on your own, while ${Math.round(home.pct)}% of people ${home.range} still live with their parents.`,
      act: atHome ? ["#list-apartment", "Plan my move"] : null, nudge: atHome && home.pct < 40 });
  }
  const lic = benchmark("license", age);
  if (lic && PROFILE.license) {
    const has = PROFILE.license === "Yes";
    out.push({ key: "license", b: lic, you: has, label: "Have a driver's license", youTxt: has ? "You have one" : "Not yet",
      msg: has ? `You're with the ${Math.round(lic.pct)}% of people ${lic.range} who can drive.`
        : `${Math.round(lic.pct)}% of people ${lic.range} have a driver's license. Ask Anything can walk you through getting yours${PROFILE.state ? ` in ${PROFILE.state}` : ""}.`,
      act: has ? null : ["#ask", "How do I get my license?"], draft: `What are the steps to get my driver's license${PROFILE.state ? ` in ${PROFILE.state}` : ""}?`, nudge: !has && lic.pct >= 50 });
  }
  return out;
}
function standCard(it){
  const pct = Math.round(it.b.pct);
  return `<div class="card stand stack">
    <div class="sec-head"><h3>${esc(it.label)}</h3><span class="chip">Ages ${esc(it.b.range)}</span></div>
    <div class="bar" role="img" aria-label="${pct}% of people ages ${esc(it.b.range)}"><span style="width:${pct}%"></span><b>${pct}%</b></div>
    <p class="small"><b>${esc(it.youTxt)}.</b> ${esc(it.msg)}</p>
    ${it.act ? `<a class="btn ghost full" href="${it.act[0]}" data-draft="${esc(it.draft || "")}">${esc(it.act[1])}</a>` : ""}
    <p class="src">Source: ${esc(BENCHMARKS[it.key].source)}</p></div>`;
}
function standSection(homeOnly){
  const items = standItems();
  if (homeOnly) {
    const it = items.find((x) => x.nudge);
    return it ? `<section class="sec"><div class="sec-head"><h2>Where you stand</h2><a href="#me">See all</a></div>${standCard(it)}</section>` : "";
  }
  if (!items.length) return `<section class="sec"><h2>Where you stand</h2><div class="card"><p class="muted small">Add your age, where you live, and whether you drive below to see how you compare with people your age.</p></div></section>`;
  return `<section class="sec"><h2>Where you stand</h2><p class="muted small">Everyone moves at their own pace. This shows where most people your age are, so you can decide what's next.</p>${items.map(standCard).join("")}</section>`;
}
document.addEventListener("click", (e) => { const a = e.target.closest && e.target.closest("a[data-draft]"); if (a && a.dataset.draft) store.set("draft", a.dataset.draft); });

/* ---------- Me: profile and progress ---------- */
const STATES = ["Alabama","Alaska","Arizona","Arkansas","California","Colorado","Connecticut","Delaware","District of Columbia","Florida","Georgia","Hawaii","Idaho","Illinois","Indiana","Iowa","Kansas","Kentucky","Louisiana","Maine","Maryland","Massachusetts","Michigan","Minnesota","Mississippi","Missouri","Montana","Nebraska","Nevada","New Hampshire","New Jersey","New Mexico","New York","North Carolina","North Dakota","Ohio","Oklahoma","Oregon","Pennsylvania","Rhode Island","South Carolina","South Dakota","Tennessee","Texas","Utah","Vermont","Virginia","Washington","West Virginia","Wisconsin","Wyoming"];
const LIVING = ["Dorm", "Apartment", "House", "With family", "Other"];
const LICENSE = ["Yes", "Learner's permit", "Not yet"];
const STAGES = ["High school senior", "College student", "First job", "Moving out soon", "Just moved", "Other"];
const opts = (list, v) => `<option value="">Choose one</option>` + list.map((x) => `<option${x === v ? " selected" : ""}>${esc(x)}</option>`).join("");
function meView(){
  const p = PROFILE;
  app.innerHTML = `<section class="hello"><h1>Me</h1></section>
  ${standSection(false)}
  <section class="sec"><div class="card lvl"><span class="big">${DONE.length}</span><span><h3>Skills learned</h3><span class="muted small">${DONE.length ? "Finish a guide and tap I did it to add more." : "Finish any guide and tap I did it to start your count."}</span></span></div></section>
  <section class="sec"><div class="sec-head"><h2>About you</h2></div>
    <p class="muted small">This makes answers fit your life, like your state's rules or your exact car. It stays on this device.</p>
    <form class="form" id="pf">
      <label class="f">First name<input type="text" name="name" maxlength="30" value="${esc(p.name || "")}" autocomplete="given-name"></label>
      <label class="f">State<select name="state">${opts(STATES, p.state)}</select></label>
      <label class="f">Age<input type="text" name="age" inputmode="numeric" maxlength="2" value="${esc(p.age || "")}"></label>
      <label class="f">Where you live<select name="living">${opts(LIVING, p.living)}</select></label>
      <label class="f">Driver's license<select name="license">${opts(LICENSE, p.license)}</select></label>
      <label class="f">Right now you're<select name="stage">${opts(STAGES, p.stage)}</select></label>
      <fieldset style="border:0;padding:0;margin:0" class="stack"><legend class="f" style="font-weight:700;font-size:15.5px;margin-bottom:6px">Your car (optional)</legend>
        <div class="two"><input type="text" name="carYear" inputmode="numeric" maxlength="4" placeholder="Year" aria-label="Car year" value="${esc(p.carYear || "")}"><input type="text" name="carMake" maxlength="20" placeholder="Make" aria-label="Car make" value="${esc(p.carMake || "")}"><input type="text" name="carModel" maxlength="24" placeholder="Model" aria-label="Car model" value="${esc(p.carModel || "")}"></div></fieldset>
      <button class="btn" type="submit">Save</button>
      <p class="muted small">Coming with Silver: upload your ID or car registration and Adulted fills this in for you.</p>
    </form>
  </section>
  <section class="sec"><div class="sec-head"><h2>Your plan</h2><a href="#plans">Compare plans</a></div>
    <div class="card"><b>${esc(tierName())}</b><p class="muted small">${tier() === "gold" ? "Unlimited Ask Anything questions." : `${asksLeft()} Ask Anything questions left today.`}</p></div></section>
  <section class="sec"><h2>Privacy</h2>
    <p class="muted small">Your profile, checklist, and progress stay on this device. When you use Ask Anything, your question and the profile details above (not your name) go to our server and Anthropic to write the answer. We don't store them.</p>
    <button class="btn ghost" id="wipe">Delete my data on this device</button><div id="wipeAsk" class="card stack" hidden><p>Delete your profile, checklist, and progress from this device? This can't be undone.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="wipeYes" style="background:var(--red);border-color:var(--red)">Delete everything</button><button class="btn ghost" id="wipeNo">Keep my data</button></div></div></section>`;
  $("#pf").addEventListener("submit", (e) => {
    e.preventDefault();
    const f = new FormData(e.target), next = {};
    for (const [k, v] of f.entries()) { const t = String(v).trim(); if (t) next[k] = t; }
    if (next.carYear && !/^(19|20)\d{2}$/.test(next.carYear)) delete next.carYear;
    if (next.age && !(+next.age >= 13 && +next.age <= 99)) delete next.age;
    PROFILE = next; store.set("profile", PROFILE); toast("Saved"); meView();
  });
  $("#wipe").onclick = () => { $("#wipeAsk").hidden = false; $("#wipe").hidden = true; };
  $("#wipeNo").onclick = () => { $("#wipeAsk").hidden = true; $("#wipe").hidden = false; };
  $("#wipeYes").onclick = () => {
    PROFILE = {}; DONE = []; CHECKS = {};
    ["profile", "done", "checks", "recent", "asks", "draft"].forEach((k) => store.set(k, k === "profile" || k === "checks" ? {} : k === "asks" ? { day: "", n: 0 } : k === "draft" ? "" : []));
    toast("Deleted"); meView();
  };
}

  <section class="hello"><h1>Plans</h1><p class="muted">Free covers the everyday basics. Upgrade when you want more help.</p></section>

/* ---------- routing ---------- */
const TABS = [["", "home", "Home"], ["learn", "book", "Learn"], ["ask", "chat", "Ask"], ["help", "sos", "Ready"], ["me", "user", "Me"]];
function drawTabs(h){
  const g = h.startsWith("g-") ? GUIDES[h.slice(2)] : null;
  const kit = h.startsWith("list-") && CHECKLISTS[h.slice(5)] && CHECKLISTS[h.slice(5)].kit;
  const active = h.startsWith("snap-") ? "ask" : ["shop", "budget", "cook"].includes(h) ? "learn" : kit ? "help" : h === "learn" || h.startsWith("m-") || h.startsWith("list-") ? "learn" : h === "ask" ? "ask" : h === "help" || (g && g.urgent) ? "help" : h === "me" || h === "plans" ? "me" : g ? "learn" : "";
  $("#tabs").innerHTML = TABS.map(([k, ic, l]) => `<a href="#${k}"${k === "help" ? ' class="sos"' : ""}${k === active ? ' aria-current="page"' : ""}>${ico(ic, 24)}<span>${l}</span></a>`).join("");
  $("#planChip").textContent = tierName();
}
function route(){
  const h = decodeURIComponent(location.hash.slice(1));
  drawTabs(h);
  if (h.startsWith("g-")) guideView(h.slice(2));
  else if (h.startsWith("m-")) moduleView(h.slice(2));
  else if (h.startsWith("list-")) checklistView(h.slice(5));
  else if (h.startsWith("snap-")) snapView(h.slice(5));
  else if (h === "shop") shopView();
  else if (h === "budget") budgetView();
  else if (h === "cook") cookView();
  else if (h === "learn") learnView();
  else if (h === "ask") askView();
  else if (h === "help") helpView();
  else if (h === "me") meView();
  else if (h === "plans") plansView();
  else homeView();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();
</script>
